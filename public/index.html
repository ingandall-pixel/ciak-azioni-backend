<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Analisi di Mercato</title>
</head>
<body>

    <h1>Dashboard Finanziaria</h1>

    <!-- Pulsanti di azione -->
    <div>
        <button id="btn-analysis" onclick="startAnalysis()">Avvia analisi di mercato</button>
        <button id="btn-results" onclick="fetchResults()">Restituisci risultati</button>
    </div>

    <!-- Barra di avanzamento per l'Analisi -->
    <div id="progress-container-analysis" style="display: none; margin-top: 15px;">
        <p id="status-text-analysis">Preparazione analisi...</p>
        <div style="width: 100%; background-color: #f3f3f3; border-radius: 4px; overflow: hidden;">
            <div id="progress-bar-analysis" style="width: 0%; height: 20px; background-color: #4CAF50; transition: width 0.3s;"></div>
        </div>
    </div>

    <!-- Barra di avanzamento per i Risultati -->
    <div id="progress-container-results" style="display: none; margin-top: 15px;">
        <p id="status-text-results">Caricamento risultati...</p>
        <div style="width: 100%; background-color: #f3f3f3; border-radius: 4px; overflow: hidden;">
            <div id="progress-bar-results" style="width: 0%; height: 20px; background-color: #2196F3; transition: width 0.3s;"></div>
        </div>
    </div>

    <script>
        function pollProgress(containerId, barId, textId, onComplete) {
            const container = document.getElementById(containerId);
            const bar = document.getElementById(barId);
            const text = document.getElementById(textId);
            
            container.style.display = "block";
            
            const interval = setInterval(() => {
                fetch('/progress.json?' + new Date().getTime())
                    .then(response => response.json())
                    .then(data => {
                        const percent = data.percent || 0;
                        bar.style.width = percent + "%";
                        text.innerText = data.status || `Progresso: ${percent}%`;
                        
                        if (percent >= 100) {
                            clearInterval(interval);
                            if (onComplete) onComplete(data);
                        }
                    })
                    .catch(err => {
                        console.error("Lettura progresso in corso...", err);
                    });
            }, 1000);
        }

        function startAnalysis() {
            const btn = document.getElementById('btn-analysis');
            btn.disabled = true;
            
            fetch('/run-update', { method: 'POST' })
                .then(response => {
                    if (response.ok) {
                        pollProgress(
                            'progress-container-analysis', 
                            'progress-bar-analysis', 
                            'status-text-analysis', 
                            (finalData) => {
                                alert(
                                    "Analisi di mercato completata!\n\n" +
                                    "• Azioni Italiane popolate: " + (finalData.it_count || 0) + "\n" +
                                    "  Media anni di popolamento: " + (finalData.it_avg_years !== undefined ? finalData.it_avg_years.toFixed(1) : "0.0") + " anni\n\n" +
                                    "• Azioni Americane popolate: " + (finalData.us_count || 0) + "\n" +
                                    "  Media anni di popolamento: " + (finalData.us_avg_years !== undefined ? finalData.us_avg_years.toFixed(1) : "0.0") + " anni"
                                );
                                btn.disabled = false;
                            }
                        );
                    }
                })
                .catch(err => {
                    alert("Errore di connessione al server");
                    btn.disabled = false;
                });
        }

        function fetchResults() {
            const container = document.getElementById('progress-container-results');
            const bar = document.getElementById('progress-bar-results');
            const text = document.getElementById('status-text-results');
            
            container.style.display = "block";
            bar.style.width = "0%";
            text.innerText = "Elaborazione risultati...";

            let progress = 0;
            const fakeInterval = setInterval(() => {
                progress += 25;
                bar.style.width = progress + "%";
                text.innerText = `Elaborazione risultati... ${progress}%`;
                
                if (progress >= 100) {
                    clearInterval(fakeInterval);
                    text.innerText = "Risultati pronti!";
                }
            }, 300);
        }
    </script>
</body>
</html>
