<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIAK!-AZIONI</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --success: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            margin: 0;
            background: linear-gradient(90deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .controls-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .ios-picker {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
            cursor: pointer;
        }

        select, input {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            flex: 1;
            min-width: 200px;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #334155;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #1e293b;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            color: var(--text-color);
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        a.ticker-link {
            color: #60a5fa;
            text-decoration: none;
            font-weight: bold;
        }

        a.ticker-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>CIAK!-AZIONI</h1>
        </header>

        <div class="controls-card">
            <div class="controls-grid">
                <div class="control-group">
                    <label>Timeframe</label>
                    <select id="tf-select">
                        <option value="1d">1 Giorno</option>
                        <option value="1w">1 Settimana</option>
                        <option value="1m" selected>1 Mese</option>
                        <option value="1y">1 Anno</option>
                        <option value="5y">5 Anni</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Mediana (%)</label>
                    <input type="number" id="median-val" class="ios-picker" value="50" min="1" max="100" step="1">
                </div>

                <div class="control-group">
                    <label>Deviazione Standard (%)</label>
                    <input type="number" id="std-val" class="ios-picker" value="10" min="1" max="100" step="1">
                </div>
            </div>

            <div class="btn-container">
                <button class="btn btn-secondary" onclick="avviaAnalisiMercato()">Avvia analisi di mercato</button>
                <button class="btn" onclick="restituisciRisultati()">Restituisci risultati</button>
            </div>
        </div>

        <div class="table-container">
            <table id="results-table">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">Azione ↕</th>
                        <th onclick="sortTable(1)">Prezzo ↕</th>
                        <th>Trend</th>
                        <th onclick="sortTable(3)">Perf 1 ↕</th>
                        <th onclick="sortTable(4)">Perf 2 ↕</th>
                        <th onclick="sortTable(5)">Perf 3 ↕</th>
                        <th onclick="sortTable(6)">Perf 4 ↕</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Esempio di riga strutturata con Ticker cliccabile -->
                    <tr>
                        <td><a href="https://www.investing.com/search/?q=ENEL" target="_blank" class="ticker-link">ENEL</a></td>
                        <td>6.54</td>
                        <td><img src="path_to_chart.png" alt="Trend" style="height: 30px;"></td>
                        <td>+1.2%</td>
                        <td>-0.5%</td>
                        <td>+3.4%</td>
                        <td>+2.1%</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function avviaAnalisiMercato() {
            alert("Avvio aggiornamento incrementale di mercato sul server...");
            // Logica di chiamata fetch per l'aggiornamento incrementale
        }

        function restituisciRisultati() {
            alert("Elaborazione filtri lato server in corso...");
            // Logica di chiamata fetch per ottenere i dati filtrati dal server
        }

        let sortDirection = false;

        function sortTable(columnIndex) {
            const table = document.getElementById("results-table");
            const tbody = document.getElementById("table-body");
            const rows = Array.from(tbody.querySelectorAll("tr"));
            
            sortDirection = !sortDirection;

            rows.sort((rowA, rowB) => {
                const cellA = rowA.querySelectorAll("td")[columnIndex].innerText.trim();
                const cellB = rowB.querySelectorAll("td")[columnIndex].innerText.trim();

                const numA = parseFloat(cellA.replace(/[^0-9.-]+/g, ""));
                const numB = parseFloat(cellB.replace(/[^0-9.-]+/g, ""));

                if (!isNaN(numA) && !isNaN(numB)) {
                    return sortDirection ? numA - numB : numB - numA;
                } else {
                    return sortDirection ? cellA.localeCompare(cellB) : cellB.localeCompare(cellA);
                }
            });

            tbody.innerHTML = "";
            rows.forEach(row => tbody.appendChild(row));
        }
    </script>
</body>
</html>
