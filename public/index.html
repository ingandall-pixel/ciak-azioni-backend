<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIAK! - AZIONI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
        }
        .nav-buttons {
            margin-bottom: 20px;
        }
        .nav-buttons button {
            padding: 8px 16px;
            margin-right: 5px;
            background-color: #f8f9fa;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-buttons button.active {
            background-color: #e2e6ea;
            border-color: #adb5bd;
        }
        .controls {
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        select {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        th {
            background-color: #212529;
            color: white;
        }
        tr:hover {
            background-color: #f1f3f5;
        }
        .positive {
            color: #28a745;
            font-weight: bold;
        }
        .negative {
            color: #dc3545;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Pulsanti Mercati -->
        <div class="nav-buttons">
            <button id="btn-it" class="active" onclick="switchMarket('IT')">Mercato Italiano</button>
            <button id="btn-us" onclick="switchMarket('US')">Mercato Americano</button>
        </div>

        <!-- Selettore Periodo -->
        <div class="controls">
            <label for="period-select">Periodo: </label>
            <select id="period-select" onchange="renderTable()">
                <option value="1">1 Anno</option>
                <option value="0.5">6 Mesi</option>
                <option value="0.25">3 Mesi</option>
                <option value="all">Massimo</option>
            </select>
        </div>

        <!-- Tabella Azioni -->
        <table>
            <thead>
                <tr>
                    <th>Azione</th>
                    <th>Prezzo</th>
                    <th>Var. Periodo (%)</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr>
                    <td colspan="3" class="loading">Caricamento dati in corso...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        let allData = [];
        let currentMarket = 'IT';

        function loadData() {
            fetch('/api/analyze')
                .then(res => res.json())
                .then(response => {
                    if (response.success && Array.isArray(response.data)) {
                        allData = response.data;
                    } else if (Array.isArray(response)) {
                        allData = response;
                    }
                    renderTable();
                })
                .catch(err => {
                    console.error('Errore nel recupero dati:', err);
                    document.getElementById('table-body').innerHTML = `<tr><td colspan="3" style="color:red; text-align:center;">Errore di caricamento dal server. Il database potrebbe essere vuoto.</td></tr>`;
                });
        }

        function switchMarket(market) {
            currentMarket = market;
            document.getElementById('btn-it').classList.toggle('active', market === 'IT');
            document.getElementById('btn-us').classList.toggle('active', market === 'US');
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            // Filtra per mercato corrente (IT o US)
            const filtered = allData.filter(item => item.market === currentMarket);

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="loading">Nessun dato disponibile per questo mercato. Esegui l'aggiornamento del database.</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                const tr = document.createElement('tr');
                
                const varClass = item.total_return_pct >= 0 ? 'positive' : 'negative';
                const sign = item.total_return_pct >= 0 ? '+' : '';

                tr.innerHTML = `
                    <td>${item.ticker}</td>
                    <td>${item.current_price.toFixed(2)} € / $</td>
                    <td class="${varClass}">${sign}${item.total_return_pct}%</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Avvia il caricamento all'avvio della pagina
        loadData();
    </script>
</body>
</html>
