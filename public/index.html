<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciak Azioni - Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 800px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin: auto;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        .btn-group {
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            margin-right: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #progress-container {
            margin-top: 20px;
            margin-bottom: 20px;
        }
        progress {
            width: 100%;
            height: 22px;
        }
        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #dee2e6;
            max-height: 400px;
            overflow-y: auto;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Ciak Azioni - Pannello di Controllo</h2>
        
        <div class="btn-group">
            <button onclick="startUpdateDb()">Aggiorna Database</button>
            <button onclick="startAnalyze()">Avvia Analisi</button>
        </div>

        <div id="progress-container">
            <p id="status-text">Stato: In attesa</p>
            <progress id="progress-bar" value="0" max="100"></progress>
        </div>

        <h3>Output / Risultati:</h3>
        <pre id="output">Nessun dato elaborato finora.</pre>
    </div>

    <script>
        let progressInterval = null;

        function fetchProgress() {
            fetch('/api/progress')
                .then(res => res.json())
                .then(data => {
                    const percent = data.percent || 0;
                    const status = data.status || 'Elaborazione in corso...';
                    
                    document.getElementById('progress-bar').value = percent;
                    document.getElementById('status-text').innerText = `Stato: ${status} (${percent}%)`;

                    if (percent >= 100) {
                        clearInterval(progressInterval);
                    }
                })
                .catch(err => console.error('Errore recupero progresso:', err));
        }

        function startUpdateDb() {
            document.getElementById('output').innerText = 'Aggiornamento del database storico avviato...';
            document.getElementById('progress-bar').value = 0;
            
            progressInterval = setInterval(fetchProgress, 1000);

            fetch('/api/update-db')
                .then(res => res.json())
                .then(data => {
                    clearInterval(progressInterval);
                    fetchProgress();
                    document.getElementById('output').innerText = JSON.stringify(data, null, 2);
                })
                .catch(err => {
                    clearInterval(progressInterval);
                    document.getElementById('output').innerText = 'Errore di connessione: ' + err;
                });
        }

        function startAnalyze() {
            document.getElementById('output').innerText = 'Analisi dei mercati in corso... Attendere.';
            
            fetch('/api/analyze')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('output').innerText = JSON.stringify(data, null, 2);
                })
                .catch(err => {
                    document.getElementById('output').innerText = 'Errore durante l\'analisi: ' + err;
                });
        }
    </script>
</body>
</html>
