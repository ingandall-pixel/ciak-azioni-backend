<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciak Azioni Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f9f9f9; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
        button { padding: 8px 16px; cursor: pointer; }
        .container-periodo { margin-top: 20px; margin-bottom: 20px; padding: 20px; border: 1px solid #ddd; background: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #212529; color: white; }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="visualizzaDati('italiano')">Mercato Italiano</button>
        <button onclick="visualizzaDati('americano')">Mercato Americano</button>
    </div>

    <div class="container-periodo">
        <label for="periodo"><strong>Periodo:</strong></label>
        <select id="periodo">
            <option value="1">1 Anno</option>
        </select>
    </div>

    <table id="tabella-azioni">
        <thead>
            <tr>
                <th>Azione</th>
                <th>Prezzo</th>
                <th>Var. Periodo (%)</th>
            </tr>
        </thead>
        <tbody id="corpo-tabella">
            <!-- I dati verranno inseriti qui -->
        </tbody>
    </table>

    <script>
        // Inserisci qui i tuoi dati manualmente (o verranno passati da un'altra sorgente)
        const databaseLocale = {
            italiano: [
                { azione: "Enel", prezzo: "6.80 €", var_periodo: "+1.2%" },
                { azione: "Intesa Sanpaolo", prezzo: "3.45 €", var_periodo: "+0.8%" }
            ],
            americano: [
                { azione: "Apple", prezzo: "$175.00", var_periodo: "+2.5%" },
                { azione: "Tesla", prezzo: "$220.00", var_periodo: "-1.1%" }
            ]
        };

        function visualizzaDati(mercato) {
            const corpo = document.getElementById('corpo-tabella');
            corpo.innerHTML = ''; // Svuota la tabella
            
            const datiSelezionati = databaseLocale[mercato];

            if (datiSelezionati) {
                datiSelezionati.forEach(item => {
                    const row = `<tr>
                        <td>${item.azione}</td>
                        <td>${item.prezzo}</td>
                        <td>${item.var_periodo}</td>
                    </tr>`;
                    corpo.innerHTML += row;
                });
            } else {
                corpo.innerHTML = '<tr><td colspan="3">Nessun dato disponibile</td></tr>';
            }
        }
    </script>
</body>
</html>
