<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciak Azioni Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .error-box { 
            color: #721c24; 
            background-color: #f8d7da; 
            border: 1px solid #f5c6cb; 
            padding: 15px; 
            margin-bottom: 20px; 
            display: none; 
        }
        .controls { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #333; color: white; }
    </style>
</head>
<body>

    <!-- Area per l'errore -->
    <div id="errore-box" class="error-box"></div>

    <div class="controls">
        <button onclick="caricaDati('italiano')">Mercato Italiano</button>
        <button onclick="caricaDati('americano')">Mercato Americano</button>
        
        <label for="periodo">Periodo:</label>
        <select id="periodo">
            <option value="1">1 Anno</option>
        </select>
    </div>

    <table id="tabella-azioni">
        <thead>
            <tr>
                <th>Azione</th>
                <th>Prezzo</th>
                <th>Var. Periodo (%)</th>
            </tr>
        </thead>
        <tbody id="corpo-tabella">
            <!-- I dati verranno inseriti qui -->
        </tbody>
    </table>

    <script>
        async function caricaDati(mercato) {
            const erroreBox = document.getElementById('errore-box');
            erroreBox.style.display = 'none';

            try {
                // Percorso corretto: ../ esce dalla cartella public per trovare il file nella root
                const response = await fetch('../market_db.json');
                
                if (!response.ok) {
                    throw new Error(`Errore HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                popolaTabella(data[mercato]);
                
            } catch (error) {
                console.error(error);
                erroreBox.innerText = "Errore nel caricamento dei dati di mercato: Impossibile caricare market_db.json";
                erroreBox.style.display = 'block';
            }
        }

        function popolaTabella(azioni) {
            const corpo = document.getElementById('corpo-tabella');
            corpo.innerHTML = ''; // Pulisce la tabella
            
            azioni.forEach(item => {
                const row = `<tr>
                    <td>${item.azione}</td>
                    <td>${item.prezzo}</td>
                    <td>${item.var_periodo}</td>
                </tr>`;
                corpo.innerHTML += row;
            });
        }
    </script>
</body>
</html>
