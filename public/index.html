<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIAK!-AZIONI</title>
    <style>
        body {
            background-color: #121418;
            color: #e1e1e6;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }
        .sub-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        /* Icona mano rossa con dito medio alzato */
        .middle-finger-icon {
            width: 32px;
            height: 32px;
            fill: #ff3333;
        }
        .controls-panel {
            background-color: #1a1d24;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
            border: 1px solid #2a2e39;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 14px;
            color: #8b949e;
        }
        select, input {
            background-color: #121418;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #30363d;
        }
        .btn-primary {
            background-color: #238636;
            color: #ffffff;
            border-color: #2ea043;
        }
        .btn-primary:hover {
            background-color: #2ea043;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1a1d24;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2a2e39;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #2a2e39;
            font-size: 14px;
        }
        th {
            background-color: #161b22;
            color: #8b949e;
            cursor: pointer;
        }
        tr:hover {
            background-color: #21262d;
        }
    </style>
</head>
<body>

    <header>
        <h1>CIAK!-AZIONI</h1>
        <!-- Rimosso l'account/omino in alto a destra -->
    </header>

    <div class="sub-header">
        <!-- Mano rossa con dito medio alzato rivolto verso chi guarda -->
        <svg class="middle-finger-icon" viewBox="0 0 24 24">
            <path d="M10 3c-1.1 0-2 .9-2 2v6H7c-1.1 0-2 .9-2 2v2c0 3.3 2.7 6 6 6h2c4.4 0 8-3.6 8-8v-3c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2h-3zm0 2h3v8h1v2c0 2.2-1.8 4-4 4h-2c-2.2 0-4-1.8-4-4v-2h1V5h3v6h2V5zm5 0h2v6h-2V5z"/>
        </svg>
    </div>

    <!-- Pannello dei controlli con i pulsanti per l'analisi e l'aggiornamento -->
    <div class="controls-panel">
        <div class="control-group">
            <label for="timeframeSelect">TIME FRAME</label>
            <select id="timeframeSelect">
                <option value="3m">3 Mesi</option>
                <option value="6m">6 Mesi</option>
                <option value="1y">1 Anno</option>
            </select>
        </div>
        <div class="control-group">
            <label for="medianInput">Median (%)</label>
            <input type="text" id="medianInput" placeholder="Inserisci valore">
        </div>
        <div class="control-group">
            <label for="stdInput">Dev. Std. (%)</label>
            <input type="text" id="stdInput" placeholder="Inserisci valore">
        </div>
        
        <!-- Pulsante per Avviare l'analisi di mercato (Aggiorna Mercato) -->
        <button class="btn-primary" onclick="avviaAnalisiMercato()">AGGIORNA MERCATO</button>
        
        <!-- Pulsante per Restituire/Visualizzare i risultati dell'analisi -->
        <button onclick="restituisciRisultati()">RESTITUISCI RISULTATI</button>
    </div>

    <h2>RISULTATI DELL'ANALISI</h2>
    <table id="resultsTable">
        <thead>
            <tr>
                <th onclick="sortTable(0)">Ticker</th>
                <th onclick="sortTable(1)">Descrizione</th>
                <th onclick="sortTable(2)">Mediana(%)</th>
                <th onclick="sortTable(3)">Dev.Std(%)</th>
                <th onclick="sortTable(4)">Ult.Prezzo</th>
                <th onclick="sortTable(5)">Variaz.%</th>
                <th>Trend</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- I dati verranno popolati dinamicamente tramite JavaScript -->
        </tbody>
    </table>

    <script>
        async function avviaAnalisiMercato() {
            try {
                const response = await fetch('/api/update-market', { method: 'POST' });
                const data = await response.json();
                alert("Aggiornamento mercato avviato con successo!");
            } catch (error) {
                console.error("Errore durante l'aggiornamento:", error);
            }
        }

        async function restituisciRisultati() {
            try {
                const response = await fetch('/api/get-results');
                const results = await response.json();
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                results.forEach(item => {
                    const row = `<tr>
                        <td>${item.ticker}</td>
                        <td>${item.description}</td>
                        <td>${item.median}</td>
                        <td>${item.std}</td>
                        <td>${item.price}</td>
                        <td style="color: ${item.change >= 0 ? '#3fb950' : '#f85149'}">${item.change}%</td>
                        <td>[Grafico]</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error("Errore nel recupero dei risultati:", error);
            }
        }

        function sortTable(columnIndex) {
            // Logica di ordinamento tabella
        }
    </script>
</body>
</html>
