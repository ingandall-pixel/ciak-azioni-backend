<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciak Azioni Dashboard</title>
    <!-- Bootstrap CSS per una grafica pulita e responsive -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-4">
        <!-- Header / Stato -->
        <div class="row mb-4">
            <div class="col-12">
                <div id="status-box" class="alert alert-secondary" role="status">
                    Caricamento dati di mercato in corso...
                </div>
            </div>
        </div>

        <!-- Selettori Mercato -->
        <div class="row mb-4">
            <div class="col-12">
                <button id="btn-it" class="btn btn-primary me-2">Mercato Italiano</button>
                <button id="btn-us" class="btn btn-outline-primary">Mercato Americano</button>
            </div>
        </div>

        <!-- Controlli: Periodo e Sliders -->
        <div class="card shadow-sm p-3 mb-4">
            <div class="row align-items-center">
                <!-- Selettore Periodo Completo -->
                <div class="col-md-4 mb-3 mb-md-0">
                    <label for="select-periodo" class="form-label fw-bold">Periodo:</label>
                    <select id="select-periodo" class="form-select">
                        <option value="1d">1 Giorno</option>
                        <option value="1w">1 Settimana</option>
                        <option value="1m">1 Mese</option>
                        <option value="1y" selected>1 Anno</option>
                        <option value="5y">5 Anni</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Tabella Risultati -->
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Azione</th>
                            <th>Prezzo</th>
                            <th>Var. Periodo (%)</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- I dati verranno inseriti qui dinamicamente via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script JavaScript Completo -->
    <script>
        // Mappatura dei giorni di borsa (sessioni) per ciascun periodo selezionato
        const periodiOffset = {
            '1d': 1,
            '1w': 5,
            '1m': 21,
            '1y': 252,
            '5y': 1300
        };

        let globalMarketData = {};
        let currentMarket = 'IT'; // 'IT' o 'US'

        // Funzione per calcolare la variazione percentuale in base al periodo scelto
        function calcolaVariazione(storicoPrezzi, periodoSelezionato) {
            const dateKeys = Object.keys(storicoPrezzi).sort();
            if (dateKeys.length < 2) return 0;

            const offset = periodiOffset[periodoSelezionato] || 252;
            const indiceFinale = dateKeys.length - 1;
            const indiceIniziale = Math.max(0, indiceFinale - offset);

            const prezzoInizio = storicoPrezzi[dateKeys[indiceIniziale]];
            const prezzoFine = storicoPrezzi[dateKeys[indiceFinale]];

            if (!prezzoInizio || prezzoInizio === 0) return 0;
            return ((prezzoFine - prezzoInizio) / prezzoInizio) * 100;
        }

        // Funzione per aggiornare la tabella in-page
        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const periodoScelto = document.getElementById('select-periodo').value;

            for (const [ticker, storico] of Object.entries(globalMarketData)) {
                // Filtra in base al mercato selezionato
                const isIt = ticker.endswith('.MI') || ticker.endswith('.AS') || !ticker.match(/^[A-Z\-]+$/);
                if (currentMarket === 'IT' && !isIt) continue;
                if (currentMarket === 'US' && isIt) continue;

                const dateKeys = Object.keys(storico).sort();
                if (dateKeys.length === 0) continue;

                const ultimoPrezzo = storico[dateKeys[dateKeys.length - 1]];
                const varPct = calcolaVariazione(storico, periodoScelto);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold">${ticker}</td>
                    <td>${ultimoPrezzo.toFixed(2)}</td>
                    <td class="${varPct >= 0 ? 'text-success' : 'text-danger'} fw-bold">
                        ${varPct >= 0 ? '+' : ''}${varPct.toFixed(2)}%
                    </td>
                `;
                tbody.appendChild(tr);
            }
        }

        // Event Listeners per i pulsanti di mercato
        document.getElementById('btn-it').addEventListener('click', () => {
            currentMarket = 'IT';
            document.getElementById('btn-it').className = 'btn btn-primary me-2';
            document.getElementById('btn-us').className = 'btn btn-outline-primary';
            renderTable();
        });

        document.getElementById('btn-us').addEventListener('click', () => {
            currentMarket = 'US';
            document.getElementById('btn-us').className = 'btn btn-primary me-2';
            document.getElementById('btn-it').className = 'btn btn-outline-primary';
            renderTable();
        });

        // Event Listener per il cambio del periodo nel menu a tendina
        document.getElementById('select-periodo').addEventListener('change', () => {
            renderTable();
        });

        // Caricamento iniziale dei dati dal file JSON del database
        async function init() {
            try {
                const response = await fetch('market_db.json');
                if (!response.ok) throw new Error("Impossibile caricare market_db.json");
                globalMarketData = await response.json();
                
                document.getElementById('status-box').className = 'alert alert-success';
                document.getElementById('status-box').innerText = 'Archivio caricato con successo!';
                
                renderTable();
            } catch (error) {
                document.getElementById('status-box').className = 'alert alert-danger';
                document.getElementById('status-box').innerText = 'Errore nel caricamento dei dati di mercato.';
            }
        }

        // Avvio script al caricamento della pagina
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
